<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- Title -->
  <text x="60" y="64" font-size="36" font-weight="700" fill="#f8fafc">Agent Team Kit</text>
  <text x="60" y="98" font-size="20" fill="#94a3b8">One human decider. A team of AI agents that know your stack.</text>
  <text x="1540" y="64" font-size="16" fill="#64748b" text-anchor="end">Claude Code plugin · MIT · github.com/Tushar-Pingle/agent-team-kit</text>

  <!-- ===== Left panel: onboarding ===== -->
  <rect x="60" y="140" width="460" height="570" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="182" font-size="22" font-weight="700" fill="#f8fafc">1 · Onboard, before any code</text>
  <text x="90" y="206" font-size="15" fill="#94a3b8">/agent-team-kit:onboard-project</text>

  <g font-size="17" fill="#e2e8f0">
    <rect x="90" y="228" width="400" height="54" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="251" font-weight="600">Repo scan</text>
    <text x="110" y="272" font-size="14" fill="#94a3b8">languages · frameworks · commands · CI · layout</text>

    <line x1="290" y1="282" x2="290" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="302" width="400" height="54" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="325" font-weight="600">Context Q&amp;A with the decider</text>
    <text x="110" y="346" font-size="14" fill="#94a3b8">users · stage · constraints · what "done" means</text>

    <line x1="290" y1="356" x2="290" y2="374" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="376" width="400" height="54" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="399" font-weight="600">Web check of the stack</text>
    <text x="110" y="420" font-size="14" fill="#94a3b8">current conventions, with sources</text>

    <line x1="290" y1="430" x2="290" y2="448" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="450" width="400" height="54" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="473" font-weight="600">Plans by Q&amp;A</text>
    <text x="110" y="494" font-size="14" fill="#94a3b8">North Star · component plans · ADRs · slices</text>

    <line x1="290" y1="504" x2="290" y2="522" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="524" width="400" height="54" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="547" font-weight="600">team.json</text>
    <text x="110" y="568" font-size="14" fill="#94a3b8">preset · roles · folders · model tiers · stack per role</text>

    <line x1="290" y1="578" x2="290" y2="596" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="598" width="400" height="54" rx="10" fill="#0f172a" stroke="#34d399"/>
    <text x="110" y="621" font-weight="600" fill="#34d399">setup-team scaffolds</text>
    <text x="110" y="642" font-size="14" fill="#94a3b8">role files · hooks · skills · role tests · logs</text>
  </g>
  <text x="90" y="688" font-size="15" font-style="italic" fill="#fbbf24">Exit rule: zero open questions before the first build.</text>

  <!-- ===== Centre panel: the running team ===== -->
  <rect x="560" y="140" width="980" height="570" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="182" font-size="22" font-weight="700" fill="#f8fafc">2 · Run: you talk to one agent</text>
  <text x="590" y="206" font-size="15" fill="#94a3b8">claude --agent pm</text>

  <!-- Decider -->
  <circle cx="1050" cy="258" r="34" fill="#f59e0b"/>
  <text x="1050" y="264" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">YOU</text>
  <text x="1002" y="252" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="end">The decider</text>
  <text x="1002" y="272" font-size="14" fill="#94a3b8" text-anchor="end">approves scope, merges, deploys</text>

  <!-- Decider <-> PM -->
  <line x1="1050" y1="292" x2="1050" y2="328" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

  <!-- PM -->
  <rect x="930" y="330" width="240" height="56" rx="12" fill="#a78bfa"/>
  <text x="1050" y="353" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">PM</text>
  <text x="1050" y="374" font-size="13" fill="#1e1b4b" text-anchor="middle">single point of contact · writes specs</text>

  <!-- PM -> Scrum master -->
  <line x1="1050" y1="386" x2="1050" y2="416" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Scrum master -->
  <rect x="930" y="418" width="240" height="50" rx="12" fill="#334155" stroke="#60a5fa"/>
  <text x="1050" y="440" font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">Scrum master</text>
  <text x="1050" y="458" font-size="13" fill="#94a3b8" text-anchor="middle">starts sessions · routes PRs · keeps logs</text>

  <!-- fan out -->
  <path d="M1000,468 C1000,500 790,480 790,520" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1100,468 C1100,500 1310,480 1310,520" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Builders -->
  <rect x="620" y="522" width="340" height="168" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="640" y="550" font-size="17" font-weight="700" fill="#60a5fa">Builders</text>
  <text x="640" y="570" font-size="13" fill="#94a3b8">execute the spec · own folders only · know the stack</text>
  <g font-size="14" font-weight="600" fill="#e2e8f0">
    <rect x="640" y="586" width="94" height="36" rx="8" fill="#1e3a5f"/><text x="687" y="609" text-anchor="middle">Platform</text>
    <rect x="744" y="586" width="94" height="36" rx="8" fill="#1e3a5f"/><text x="791" y="609" text-anchor="middle">Backend</text>
    <rect x="848" y="586" width="94" height="36" rx="8" fill="#1e3a5f"/><text x="895" y="609" text-anchor="middle">Frontend</text>
  </g>
  <text x="640" y="650" font-size="13" fill="#94a3b8">"Your stack" in every role file:</text>
  <text x="640" y="670" font-size="13" fill="#cbd5e1">real test commands · conventions with sources · plans to read</text>

  <!-- Reviewers -->
  <rect x="1140" y="522" width="340" height="168" rx="14" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1160" y="550" font-size="17" font-weight="700" fill="#fb7185">Reviewers</text>
  <text x="1160" y="570" font-size="13" fill="#94a3b8">verdict lines only · never fix code</text>
  <g font-size="14" font-weight="600" fill="#e2e8f0">
    <rect x="1160" y="586" width="94" height="36" rx="8" fill="#4c1d2e"/><text x="1207" y="609" text-anchor="middle">QA</text>
    <rect x="1264" y="586" width="94" height="36" rx="8" fill="#4c1d2e"/><text x="1311" y="609" text-anchor="middle">UAT</text>
    <rect x="1368" y="586" width="94" height="36" rx="8" fill="#4c1d2e"/><text x="1415" y="609" text-anchor="middle">Designer</text>
  </g>
  <text x="1160" y="650" font-size="13" fill="#94a3b8">first line of every review:</text>
  <text x="1160" y="670" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#cbd5e1">QA: PASS  ·  UAT: CHANGES NEEDED</text>

  <!-- PR loop between builders and reviewers -->
  <line x1="960" y1="590" x2="1138" y2="590" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1050" y="582" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">opens PR</text>
  <line x1="1138" y1="630" x2="960" y2="630" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <text x="1050" y="650" font-size="13" font-weight="600" fill="#fb7185" text-anchor="middle">CHANGES NEEDED</text>

  <!-- PASS back up to the decider -->
  <path d="M1480,560 C1520,560 1520,258 1096,258" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <text x="1512" y="410" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" transform="rotate(-90 1512 410)">PASS → PM reports → you merge</text>

  <!-- builder asks PM, never guesses -->
  <path d="M660,522 C660,430 700,372 928,352" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="690" y="440" font-size="13" fill="#a78bfa">unclear spec? stop that part,</text>
  <text x="690" y="458" font-size="13" fill="#a78bfa">ask the PM. Never guess.</text>

  <!-- ===== Bottom band: guardrails and cost ===== -->
  <text x="60" y="762" font-size="18" font-weight="700" fill="#f8fafc">3 · Trust, but verify the agents</text>

  <g font-size="14">
    <rect x="60" y="776" width="350" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="802" font-size="16" font-weight="700" fill="#60a5fa">Guard hooks</text>
    <text x="80" y="824" fill="#cbd5e1">no push to main · no secrets in writes</text>
    <text x="80" y="844" fill="#cbd5e1">writes only inside the role's folders</text>

    <rect x="436" y="776" width="350" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="456" y="802" font-size="16" font-weight="700" fill="#fb7185">Permissions</text>
    <text x="456" y="824" fill="#cbd5e1">reviewers have no edit tools</text>
    <text x="456" y="844" fill="#cbd5e1">outbound content is drafts only</text>

    <rect x="812" y="776" width="350" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="832" y="802" font-size="16" font-weight="700" fill="#a78bfa">Role tests</text>
    <text x="832" y="824" fill="#cbd5e1">planted traps, pass criteria</text>
    <text x="832" y="844" fill="#cbd5e1">no role file runs before it passes</text>

    <rect x="1188" y="776" width="352" height="92" rx="12" fill="#1e293b" stroke="#fbbf24"/>
    <text x="1208" y="802" font-size="16" font-weight="700" fill="#fbbf24">Cost, every session</text>
    <text x="1208" y="824" fill="#cbd5e1">tokens by model, priced from your table</text>
    <text x="1208" y="844" fill="#cbd5e1">one line in docs/log/COST.md</text>
  </g>
</svg>
